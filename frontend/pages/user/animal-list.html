<!-- frontend/pages/user/animal-list.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动物图鉴</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="header">
    <h2>🐾 校园流浪动物图鉴</h2>
    <div class="user-info">
        <span id="username-display"></span>
        <button onclick="logout()">退出</button>
    </div>
</div>
<div class="container">
    <div class="toolbar">
        <input type="text" id="search-name" placeholder="搜索名字...">
        <select id="filter-type">
            <option value="">全部类型</option>
            <option value="CAT">🐱 猫</option>
            <option value="DOG">🐶 狗</option>
        </select>
        <button onclick="search()">搜索</button>
    </div>
    <div class="card-list" id="card-list"></div>
    <div class="pagination" id="pagination"></div>
</div>
<script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'USER') { window.location.href = '../login.html'; }
    document.getElementById('username-display').textContent = '👤 ' + user.username;
    const authHeader = { 'Authorization': 'Basic ' + btoa(user.username + ':123456') };

    let page = 0;
    function search(p = 0) { page = p; loadAnimals(); }
    function loadAnimals() {
        const name = document.getElementById('search-name').value;
        const type = document.getElementById('filter-type').value;
        fetch(`http://localhost:8080/api/animals?name=${name}&type=${type}&page=${page}&size=6`, { headers: authHeader })
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('card-list');
                list.innerHTML = data.data.content.map(a => `
                    <div class="card" onclick="goDetail(${a.id})">
                        <img src="http://localhost:8080${a.coverImage || ''}" alt="${a.name}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22280%22 height=%22200%22><rect fill=%22%23ddd%22 width=%22280%22 height=%22200%22/><text x=%22140%22 y=%22110%22 text-anchor=%22middle%22 fill=%22%23999%22>暂无图片</text></svg>'">
                        <div class="info">
                            <h3>${a.name} ${a.type === 'CAT' ? '🐱' : '🐶'}</h3>
                            <p>📍 ${a.area || '未知区域'}</p>
                        </div>
                    </div>
                `).join('');
                renderPagination(data.data);
            });
    }
    function renderPagination(d) {
        const p = document.getElementById('pagination');
        p.innerHTML = `
                <button ${d.first ? 'disabled' : ''} onclick="search(0)">首页</button>
                <button ${d.first ? 'disabled' : ''} onclick="search(${page - 1})">上一页</button>
                <span>第 ${page + 1} / ${d.totalPages} 页</span>
                <button ${d.last ? 'disabled' : ''} onclick="search(${page + 1})">下一页</button>
                <button ${d.last ? 'disabled' : ''} onclick="search(${d.totalPages - 1})">末页</button>
            `;
    }
    function goDetail(id) { window.location.href = `animal-detail.html?id=${id}`; }
    function logout() { localStorage.clear(); window.location.href = '../login.html'; }
    loadAnimals();
</script>
</body>
</html>

<!-- frontend/pages/user/checkin-publish.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布打卡</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="header">
    <h2>✏️ 发布偶遇打卡</h2>
    <div class="user-info">
        <span id="username-display"></span>
        <button onclick="logout()">退出</button>
    </div>
</div>
<div class="container">
    <button style="margin-bottom:15px; padding:8px 20px; cursor:pointer; border-radius:4px; border:1px solid #ddd;" onclick="history.back()">← 返回</button>
    <div class="form-box">
        <label>选择动物</label>
        <select id="animal-select"></select>
        <label>打卡内容</label>
        <textarea id="content" rows="4" placeholder="描述一下偶遇情况..."></textarea>
        <button onclick="submitCheckIn()">发布打卡</button>
        <button class="cancel" onclick="history.back()">取消</button>
        <p id="msg"></p>
    </div>
</div>
<script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'USER') { window.location.href = '../login.html'; }
    document.getElementById('username-display').textContent = '👤 ' + user.username;
    const authHeader = { 'Authorization': 'Basic ' + btoa(user.username + ':123456') };

    const params = new URLSearchParams(window.location.search);
    const preAnimalId = params.get('animalId');

    fetch(`http://localhost:8080/api/animals?size=100`, { headers: authHeader })
        .then(res => res.json())
        .then(d => {
            const select = document.getElementById('animal-select');
            select.innerHTML = d.data.content.map(a =>
                `<option value="${a.id}" ${a.id == preAnimalId ? 'selected' : ''}>${a.name} (${a.type === 'CAT' ? '猫' : '狗'} - ${a.area || ''})</option>`
            ).join('');
        });

    function submitCheckIn() {
        const animalId = document.getElementById('animal-select').value;
        const content = document.getElementById('content').value;
        if (!content.trim()) { document.getElementById('msg').textContent = '请输入打卡内容'; return; }
        fetch('http://localhost:8080/api/check-ins', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': authHeader['Authorization']
            },
            body: JSON.stringify({ animalId: Number(animalId), userId: user.id, content })
        })
            .then(res => res.json())
            .then(d => {
                if (d.code === 200) {
                    window.location.href = `animal-detail.html?id=${animalId}`;
                } else {
                    document.getElementById('msg').textContent = d.message;
                }
            });
    }
    function logout() { localStorage.clear(); window.location.href = '../login.html'; }
</script>
</body>
</html>
